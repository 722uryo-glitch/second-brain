name: V1 smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-and-core-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: python -m pip install --quiet httpx==0.28.1 fastapi==0.116.1 python-multipart==0.0.20
      - name: Compile Python sources
        run: python -m compileall -q app
      - name: Run core regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
