<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Second Brain</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:#111;color:#eee}.wrap{max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.card{background:#1b1b1b;border:1px solid #333;border-radius:14px;padding:16px}.chat{height:58vh;overflow:auto;white-space:pre-wrap}.msg{padding:10px 12px;margin:8px 0;border-radius:10px;background:#262626}.me{background:#303640}.job{border:1px solid #445;border-radius:10px;padding:10px 12px;margin:8px 0;background:#171b22}.job .status{font-weight:700}.row{display:flex;gap:8px;margin-top:10px}input,textarea,button{font:inherit}textarea,input{width:100%;box-sizing:border-box;background:#101010;color:#eee;border:1px solid #444;border-radius:9px;padding:10px}button{background:#eee;color:#111;border:0;border-radius:9px;padding:10px 14px;cursor:pointer}.small{font-size:12px;color:#aaa}.memory{border-bottom:1px solid #333;padding:8px 0}.ok{color:#8fda8f}.bad{color:#ff9797}.running{color:#ffd37a}.done{color:#8fda8f}.cancelled{color:#aaa}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<h1>Second Brain</h1><div id="health" class="small">checking...</div>
<div class="grid">
<section class="card"><h2>Chat</h2><div id="chat" class="chat"></div><div class="row"><textarea id="message" rows="3" placeholder="話しかける…"></textarea><button id="sendBtn" onclick="send()">送信</button></div><div class="row"><button onclick="reflectNow()">今すぐ内省</button><input id="audio" type="file" accept="audio/*" /><button onclick="transcribe()">音声→記憶</button></div></section>
<aside class="card"><h2>Memory</h2><textarea id="note" rows="3" placeholder="覚えておいてほしいこと"></textarea><div class="row"><button onclick="saveNote()">記憶する</button><button onclick="loadMemories()">更新</button></div><div id="memories"></div></aside>
</div></div>
<script>
const $=id=>document.getElementById(id);
const activeJobs=new Map();
function add(text,me=false){const d=document.createElement('div');d.className='msg '+(me?'me':'');d.textContent=text;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;return d}
function addJob(jobId,text){const d=document.createElement('div');d.className='job';d.id='job-'+jobId;d.innerHTML=`<div class="status running">Job: ${esc(jobId.slice(0,10))} — queued</div><div class="goal"></div><div class="jobtext">${esc(text)}</div><div class="budget small"></div><div class="steps small"></div><div class="artifacts"></div><div class="small">依頼は保存済みです。画面を閉じても処理は続きます。</div><div class="row"><button onclick="cancelJob('${jobId}')">取消</button></div>`;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;activeJobs.set(jobId,{lastEvent:0,done:false});pollJob(jobId);return d}
async function health(){try{const r=await fetch('/api/health');const j=await r.json();$('health').innerHTML=j.ok?`<span class="ok">● 接続済み</span> ${esc(j.version||'')} / ${esc((j.models||[]).join(', '))}`:`<span class="bad">● 未接続</span> ${esc(j.error||'')}`}catch(e){$('health').innerHTML=`<span class="bad">● API接続失敗</span> ${esc(e)}`}}
async function send(){const m=$('message').value.trim();if(!m)return;add(m,true);$('message').value='';$('sendBtn').disabled=true;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});const j=await r.json();if(j.async&&j.job_id){addJob(j.job_id,j.response||'バックグラウンド処理を開始しました。')}else{add(j.response||('Error: '+(j.detail||'unknown')));loadMemories()}}catch(e){add('Error: '+e)}finally{$('sendBtn').disabled=false}}
const stepNames={history:'会話の確認',plan:'目的と計画',agent_run:'実行記録',memory:'記憶の確認',research:'調査',draft:'下書き',review:'根拠監査',revise:'修正',coverage:'証拠の評価',query:'資料の収集',final:'回答保存',persist:'記憶への保存',accepted:'開始待ち',starting:'開始準備',resume_queued:'再開待ち',recovered_after_lease_expiry:'再開準備'};
function stepLabel(key){return stepNames[String(key).replace(/^v1:/,'').split(':')[0]]||key}
async function pollJob(jobId){
 const state=activeJobs.get(jobId);if(!state||state.done)return;
 try{
  const r=await fetch('/api/jobs/'+jobId);const j=await r.json();if(!r.ok)throw new Error(j.detail||'状態を取得できません');
  const job=j.job,box=$('job-'+jobId);if(!box||state.done)return;
  const terminal=['succeeded','partial','failed','cancelled'].includes(job.status);
  const labels={queued:'受付済み',running:'実行中',succeeded:'完了',partial:'途中成果あり',failed:'失敗',cancelled:'取消済み'};
  box.querySelector('.status').textContent=labels[job.status]||job.status;
  box.querySelector('.goal').textContent='依頼: '+job.request;
  box.querySelector('.jobtext').textContent=terminal?(job.error||labels[job.status]):'現在: '+stepLabel(job.current_step||'開始待ち');
  box.querySelector('.budget').textContent=job.deadline_at?'今回の処理期限: '+new Date(job.deadline_at).toLocaleString():'開始後の処理時間上限: '+Math.round(job.max_runtime_seconds/60)+'分';
  box.querySelector('.steps').textContent=(j.steps||[]).map(x=>stepLabel(x.step_key)+': '+({succeeded:'保存済み',running:'実行中',failed:'失敗',interrupted:'中断'}[x.status]||x.status)).join(' / ');
  const visible=(j.artifacts||[]).filter(a=>['research_pack','evidence_snapshot','draft','critique','revised_draft','answer'].includes(a.kind));
  const area=box.querySelector('.artifacts');
  for(const a of visible){if(area.querySelector('[data-artifact="'+a.id+'"]'))continue;const d=document.createElement('details');d.dataset.artifact=a.id;const summary=document.createElement('summary');summary.textContent=stepLabel(a.title)+'（途中記録・未検証内容を含む）';const pre=document.createElement('pre');pre.style.whiteSpace='pre-wrap';pre.textContent=a.content;d.append(summary,pre);area.appendChild(d)}
  const coverage=visible.filter(a=>a.kind==='evidence_snapshot').slice(-1)[0];
  if(coverage){try{const c=JSON.parse(coverage.content);box.querySelector('.jobtext').textContent+='\n確認済み: '+(c.supported_conclusions||[]).join(' / ')+'\n未確認: '+(c.missing_facets||[]).join(' / ')}catch(e){}}
  if(terminal){state.done=true;box.querySelector('.row').replaceChildren();if(job.status!=='succeeded'&&(job.error||job.status==='cancelled')){const b=document.createElement('button');b.textContent='処理枠を追加して再開（'+Math.round(job.max_runtime_seconds/60)+'分）';b.onclick=()=>resumeJob(jobId);box.querySelector('.row').appendChild(b)}if(job.result_text)add(job.result_text);loadMemories();return}
 }catch(e){const box=$('job-'+jobId);if(box)box.querySelector('.jobtext').textContent='状態確認に失敗: '+e}
 setTimeout(()=>pollJob(jobId),1500)
}
async function cancelJob(jobId){try{const r=await fetch('/api/jobs/'+jobId+'/cancel',{method:'POST'});if(!r.ok)throw new Error('取消に失敗しました');pollJob(jobId)}catch(e){add(String(e))}}
async function resumeJob(jobId){try{const r=await fetch('/api/jobs/'+jobId+'/resume',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({extend_budget:true})});const j=await r.json();if(!r.ok)throw new Error(j.detail);activeJobs.get(jobId).done=false;const row=$('job-'+jobId).querySelector('.row');row.replaceChildren();const b=document.createElement('button');b.textContent='取消';b.onclick=()=>cancelJob(jobId);row.appendChild(b);pollJob(jobId)}catch(e){add(String(e))}}
async function restoreJobs(){try{const r=await fetch('/api/jobs?limit=20');const xs=await r.json();for(const job of xs.reverse()){if(!$('job-'+job.id))addJob(job.id,'保存済みの依頼を読み込みました。')}}catch(e){}}
async function saveNote(){const c=$('note').value.trim();if(!c)return;await fetch('/api/memories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:c,kind:'note',importance:.8})});$('note').value='';loadMemories()}
async function loadMemories(){const r=await fetch('/api/memories?limit=40');const xs=await r.json();$('memories').innerHTML=xs.map(x=>`<div class="memory"><b>${esc(x.kind)}</b> <span class="small">${esc(x.source)}</span><div>${esc(x.content)}</div><span class="small">${esc(x.created_at)}</span></div>`).join('')}
async function reflectNow(){add('内省中…');const r=await fetch('/api/reflect',{method:'POST'});const j=await r.json();add('［内省］ '+j.reflection);loadMemories()}
async function transcribe(){const f=$('audio').files[0];if(!f)return;add('音声を文字起こし中…');const fd=new FormData();fd.append('file',f);const r=await fetch('/api/transcribe',{method:'POST',body:fd});const j=await r.json();add('［文字起こし］ '+(j.text||j.detail));loadMemories()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
health();loadMemories();restoreJobs();
</script></body></html>
